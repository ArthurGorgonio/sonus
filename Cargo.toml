[workspace]
members = [
    # "crates/sonus-cli",
    "crates/sonus-core",
]
resolver = "2"

[workspace.package]
#name = "sonus"
version = "0.0.1"
edition = "2024"
authors = ["Arthur Gorgonio <gorgonioarthur@gmail.com>"]
readme = "README.md"
repository = "https://github.com/arthurgorgonio/sonus"
license = "MIT AND Apache-2.0"

[workspace.dependencies]
rodio = "0.22.2"
rust-i18n = "4.1.0"
criterion = { version = "0.8.2", features = ["html_reports"] }

